apiVersion: v1
kind: Namespace
metadata:
  name: forgeops-system
  labels:
    app.kubernetes.io/name: forgeops-control-plane
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: forgeops-agent-sa
  namespace: forgeops-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: forgeops-agent-cluster-role
rules:
  - apiGroups: ["", "apps", "batch"]
    resources: ["pods", "deployments", "jobs", "services", "namespaces"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log", "pods/exec"]
    verbs: ["get", "list", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: forgeops-agent-binding
subjects:
  - kind: ServiceAccount
    name: forgeops-agent-sa
    namespace: forgeops-system
roleRef:
  kind: ClusterRole
  name: forgeops-agent-cluster-role
  apiGroup: rbac.authorization.k8s.io
---
# 📊 Prometheus Observability Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: forgeops-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.51.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
          ports:
            - containerPort: 9090
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
  namespace: forgeops-system
spec:
  type: ClusterIP
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
      name: http
---
# 📜 Grafana Loki Log Aggregator Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: forgeops-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      containers:
        - name: loki
          image: grafana/loki:2.9.4
          ports:
            - containerPort: 3100
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: loki-service
  namespace: forgeops-system
spec:
  type: ClusterIP
  selector:
    app: loki
  ports:
    - port: 3100
      targetPort: 3100
      name: http
---
# 🤖 ForgeOps AI SRE Control Plane Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgeops-control-plane
  namespace: forgeops-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: forgeops-control-plane
  template:
    metadata:
      labels:
        app: forgeops-control-plane
    spec:
      serviceAccountName: forgeops-agent-sa
      containers:
        - name: forgeops-agent
          image: forgeops-sre:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http-ui
            - containerPort: 4000
              name: http-api
          env:
            - name: NODE_ENV
              value: "production"
            - name: PROVIDER_MODE
              value: "prometheus"
            - name: PROMETHEUS_URL
              value: "http://prometheus-service.forgeops-system.svc:9090"
            - name: LOKI_URL
              value: "http://loki-service.forgeops-system.svc:3100"
            - name: GITHUB_OWNER
              value: "vikaskumarsardar"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: forgeops-control-plane-service
  namespace: forgeops-system
spec:
  type: ClusterIP
  selector:
    app: forgeops-control-plane
  ports:
    - port: 3000
      targetPort: 3000
      name: http-ui
    - port: 4000
      targetPort: 4000
      name: http-api
